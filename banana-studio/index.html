    <style>
      body {
        background-color: #0d1117;
        color: #e2e8f0;
      }
      /* Custom scrollbar for Webkit */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a202c; 
      }
      ::-webkit-scrollbar-thumb {
        background: #4a5568; 
        border-radius: 4px;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #718096; 
      }
      /* Hide scrollbar for Chrome, Safari and Opera */
      .no-scrollbar::-webkit-scrollbar {
          display: none;
      }
      /* Hide scrollbar for IE, Edge and Firefox */
      .no-scrollbar {
          -ms-overflow-style: none;  /* IE and Edge */
          scrollbar-width: none;  /* Firefox */
      }
      /*
       * iOS Safari zooms the page whenever a focused form field renders below
       * 16px. Keep every mobile text-entry surface above that threshold rather
       * than disabling pinch zoom, which would harm accessibility.
       */
      @media screen and (max-width: 767px) {
        input:not([type="range"]):not([type="checkbox"]):not([type="radio"]):not([type="file"]):not([type="color"]):not([type="button"]):not([type="submit"]),
        textarea,
        select,
        [contenteditable="true"] {
          font-size: 16px !important;
        }
      }
      /* Masonry Grid for Gallery */
      .auto-rows-\[100px\] {
        grid-auto-rows: 100px;
      }
      
      /* Slider Styling */
      input[type=range] {
        -webkit-appearance: none; 
        background: transparent; 
      }
      input[type=range]::-webkit-slider-thumb {
        -webkit-appearance: none;
        height: 16px;
        width: 16px;
        border-radius: 50%;
        background: #8b5cf6;
        cursor: pointer;
        margin-top: -6px; 
      }
      input[type=range]::-webkit-slider-runnable-track {
        width: 100%;
        height: 4px;
        cursor: pointer;
        background: #4a5568;
        border-radius: 2px;
      }
    </style>
