name: DraBornSlot Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DraBornSlot/app/**'
      - 'DraBornSlot/*.gradle.kts'
      - 'DraBornSlot/gradle.properties'
      - 'DraBornSlot/source-v0.2.b64'
      - '.github/workflows/drabornslot-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import DraBornSlot v0.3 sources
        if: ${{ hashFiles('DraBornSlot/source-v0.2.b64') != '' }}
        run: |
          base64 --decode DraBornSlot/source-v0.2.b64 > /tmp/drabornslot-v0.3.tar.xz
          tar -xJf /tmp/drabornslot-v0.3.tar.xz -C DraBornSlot
          rm DraBornSlot/source-v0.2.b64
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A DraBornSlot
          if ! git diff --cached --quiet; then
            git commit -m "feat: DraBornSlot v0.3 modern UI and live slot interactions"
            git push origin HEAD:main
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 SDK
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon -p DraBornSlot :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornSlot-v0.2-debug-APK
          path: DraBornSlot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK='DraBornSlot/app/build/outputs/apk/debug/app-debug.apk'
          TAG='drabornslot-v0.3'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#DraBornSlot-v0.3-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#DraBornSlot-v0.3-debug.apk" --title 'DraBornSlot v0.3' --notes 'Tek telefonda 1 sn ekran kontrolü, deneme engeli düzeltmesi ve okunabilir işlem kartları. Gerçek rezervasyon kesinleşmesi cihazda doğrulanmalıdır.'
          fi
