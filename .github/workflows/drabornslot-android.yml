name: DraBornSlot Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'DraBornSlot/source.part*'
      - '.github/workflows/drabornslot-android.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Extract DraBornSlot source
        run: |
          cat DraBornSlot/source.part1 DraBornSlot/source.part2 DraBornSlot/source.part3 | base64 --decode > /tmp/drabornslot-source.tar.xz
          tar -xJf /tmp/drabornslot-source.tar.xz -C DraBornSlot
      - name: Publish extracted project files
        continue-on-error: true
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add DraBornSlot
          if ! git diff --cached --quiet; then
            git commit -m 'Add DraBornSlot v0.1 Android project source'
            git push origin HEAD:main
          fi
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android 35 SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile debug APK
        run: gradle --no-daemon -p DraBornSlot :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DraBornSlot-v0.1-debug-APK
          path: DraBornSlot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Publish APK to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK='DraBornSlot/app/build/outputs/apk/debug/app-debug.apk'
          TAG='drabornslot-v0.1'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK#DraBornSlot-v0.1-debug.apk" --clobber
          else
            gh release create "$TAG" "$APK#DraBornSlot-v0.1-debug.apk" --title 'DraBornSlot v0.1 (test APK)' --notes 'Android debug APK. Erişilebilirlik tabanlı deneysel slot otomasyonu; rezervasyon doğrulama ve 7/24 kusursuz çalışma garantisi yoktur.'
          fi
